<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CodeLab Notebook</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Cabinet+Grotesk:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f0f0e8;
  --surface: #fafaf5;
  --surface2: #e8e8e0;
  --border: #d0d0c0;
  --border2: #b8b8a8;
  --text: #1a1a14;
  --muted: #888878;
  --py: #2563eb;
  --js: #d97706;
  --sql: #059669;
  --cs: #7c3aed;
  --rs: #dc2626;
  --accent: #1a1a14;
  --shadow: 0 2px 8px rgba(0,0,0,0.08);
  --shadow-lg: 0 4px 20px rgba(0,0,0,0.12);
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family: 'Cabinet Grotesk', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  background-image: radial-gradient(circle at 20px 20px, rgba(0,0,0,0.03) 1px, transparent 0);
  background-size: 40px 40px;
}

/* HEADER */
.header {
  background: var(--text);
  color: var(--bg);
  padding: 0 24px;
  height: 56px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: var(--shadow-lg);
}
.header-left { display:flex; align-items:center; gap:12px; }
.logo { font-size:18px; font-weight:800; letter-spacing:-0.5px; }
.logo span { opacity:0.5; }
.header-status {
  font-family: 'IBM Plex Mono', monospace;
  font-size:11px;
  opacity:0.5;
  padding: 4px 10px;
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: 20px;
}
.header-status.ready { opacity:1; color:#4ade80; border-color:rgba(74,222,128,0.4); }

.header-actions { display:flex; gap:8px; align-items:center; }
.hbtn {
  padding: 7px 14px;
  border-radius: 6px;
  font-family: 'Cabinet Grotesk', sans-serif;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  border: none;
  transition: all 0.15s;
  display: flex;
  align-items: center;
  gap: 6px;
}
.hbtn-outline {
  background: transparent;
  border: 1px solid rgba(255,255,255,0.25);
  color: rgba(255,255,255,0.8);
}
.hbtn-outline:hover { background: rgba(255,255,255,0.1); color:#fff; }
.hbtn-solid {
  background: var(--bg);
  color: var(--text);
}
.hbtn-solid:hover { background: #e0e0d8; }

/* NOTEBOOK */
.notebook {
  max-width: 900px;
  margin: 0 auto;
  padding: 32px 20px 80px;
}

.notebook-title-area {
  margin-bottom: 28px;
  padding-bottom: 20px;
  border-bottom: 2px solid var(--border);
}
.notebook-title {
  font-size: 28px;
  font-weight: 800;
  letter-spacing: -1px;
  margin-bottom: 6px;
  outline: none;
  background: transparent;
  border: none;
  width: 100%;
  font-family: 'Cabinet Grotesk', sans-serif;
  color: var(--text);
}
.notebook-title:empty::before { content: 'Untitled Notebook'; color: var(--muted); }
.notebook-meta {
  font-size: 12px;
  color: var(--muted);
  font-family: 'IBM Plex Mono', monospace;
  display: flex;
  gap: 16px;
}

/* CELLS */
.cells-container { display:flex; flex-direction:column; gap:12px; }

.cell {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
  box-shadow: var(--shadow);
  transition: box-shadow 0.2s, border-color 0.2s;
  position: relative;
}
.cell:hover { box-shadow: var(--shadow-lg); }
.cell.active { border-color: var(--cell-color, #1a1a14); box-shadow: 0 0 0 2px color-mix(in srgb, var(--cell-color, #1a1a14) 15%, transparent), var(--shadow-lg); }

/* Cell left bar */
.cell::before {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 3px;
  background: var(--cell-color, var(--muted));
  opacity: 0.5;
  transition: opacity 0.2s;
}
.cell.active::before { opacity: 1; }

/* Cell Header */
.cell-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 12px 8px 16px;
  background: var(--surface2);
  border-bottom: 1px solid var(--border);
  gap: 8px;
}
.cell-left { display:flex; align-items:center; gap:8px; }
.cell-num {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  color: var(--muted);
  min-width: 24px;
}
.lang-selector {
  display: flex;
  gap: 4px;
}
.lang-pill {
  padding: 3px 9px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 700;
  font-family: 'IBM Plex Mono', monospace;
  cursor: pointer;
  border: 1px solid transparent;
  transition: all 0.15s;
  color: var(--muted);
  background: transparent;
}
.lang-pill:hover { background: var(--border); color: var(--text); }
.lang-pill.active {
  background: var(--lang-pill-color, var(--text));
  color: white;
  border-color: var(--lang-pill-color, var(--text));
}
.lang-pill.ext-pill { opacity: 0.6; }
.lang-pill.ext-pill.active { opacity: 1; }

.cell-right { display:flex; align-items:center; gap:6px; }
.cell-btn {
  width: 28px; height: 28px;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: transparent;
  cursor: pointer;
  font-size: 13px;
  display: flex; align-items:center; justify-content:center;
  transition: all 0.15s;
  color: var(--muted);
}
.cell-btn:hover { background: var(--border); color: var(--text); }
.cell-btn.danger:hover { background: #fee2e2; border-color: #fca5a5; color: #dc2626; }

.run-btn {
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 5px 12px;
  border-radius: 6px;
  font-size: 12px;
  font-weight: 700;
  font-family: 'Cabinet Grotesk', sans-serif;
  cursor: pointer;
  border: none;
  background: var(--cell-color, var(--text));
  color: white;
  transition: all 0.15s;
}
.run-btn:hover { filter: brightness(1.15); transform: translateY(-1px); }
.run-btn:active { transform: translateY(0); }
.run-btn:disabled { opacity: 0.4; cursor:not-allowed; transform:none; }

/* Editor */
.cell-editor-wrap { position: relative; }
textarea.cell-editor {
  width: 100%;
  min-height: 120px;
  background: transparent;
  border: none;
  outline: none;
  resize: none;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 13px;
  line-height: 1.7;
  color: var(--text);
  padding: 14px 14px 14px 18px;
  tab-size: 4;
  caret-color: var(--cell-color, var(--text));
}
textarea.cell-editor::placeholder { color: var(--muted); }

/* Output */
.cell-output {
  border-top: 1px solid var(--border);
  background: #1a1a14;
  color: #e8e8e0;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 12.5px;
  line-height: 1.7;
  padding: 12px 14px 12px 18px;
  max-height: 300px;
  overflow-y: auto;
  display: none;
}
.cell-output.visible { display: block; }
.cell-output::-webkit-scrollbar { width: 4px; }
.cell-output::-webkit-scrollbar-track { background: transparent; }
.cell-output::-webkit-scrollbar-thumb { background: #3a3a30; border-radius: 2px; }

.out-line { white-space: pre-wrap; word-break: break-all; margin-bottom: 1px; }
.out-line.err { color: #f87171; }
.out-line.info { color: #6b7280; font-style: italic; }
.out-line.ok { color: #4ade80; }
.out-line.warn { color: #fbbf24; }
.out-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
  padding-bottom: 8px;
  border-bottom: 1px solid #2a2a20;
}
.out-label { font-size: 10px; color: #4a4a3a; letter-spacing: 1px; text-transform: uppercase; }
.out-time { font-size: 10px; color: #4a4a3a; }

/* External cell */
.cell-external {
  padding: 20px 18px;
  display: flex;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
}
.ext-info { flex: 1; min-width: 200px; }
.ext-info-title { font-size: 14px; font-weight: 700; margin-bottom: 4px; }
.ext-info-desc { font-size: 12px; color: var(--muted); }
.ext-links { display: flex; gap: 8px; flex-wrap: wrap; }
.ext-link {
  padding: 6px 12px;
  border-radius: 6px;
  border: 1px solid var(--border);
  font-size: 12px;
  font-weight: 600;
  font-family: 'IBM Plex Mono', monospace;
  color: var(--text);
  text-decoration: none;
  background: var(--surface2);
  transition: all 0.15s;
  display: flex;
  align-items: center;
  gap: 5px;
}
.ext-link:hover { border-color: var(--cell-color); background: color-mix(in srgb, var(--cell-color) 10%, var(--surface2)); }

/* ADD CELL BUTTON */
.add-cell-area {
  display: flex;
  justify-content: center;
  margin-top: 8px;
}
.add-cell-btn {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 20px;
  border-radius: 8px;
  border: 2px dashed var(--border2);
  background: transparent;
  color: var(--muted);
  font-family: 'Cabinet Grotesk', sans-serif;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.2s;
}
.add-cell-btn:hover {
  border-color: var(--text);
  color: var(--text);
  background: var(--surface);
}

/* Lang picker modal */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.4);
  backdrop-filter: blur(4px);
  z-index: 200;
  display: flex;
  align-items: center;
  justify-content: center;
}
.modal-box {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 24px;
  width: 380px;
  max-width: 90vw;
  box-shadow: var(--shadow-lg);
}
.modal-title { font-size: 16px; font-weight: 800; margin-bottom: 16px; }
.lang-options { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.lang-option {
  padding: 14px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--surface2);
  cursor: pointer;
  transition: all 0.15s;
  text-align: left;
}
.lang-option:hover { border-color: var(--opt-color); background: color-mix(in srgb, var(--opt-color) 8%, var(--surface2)); transform: translateY(-1px); }
.lang-option .opt-name { font-size: 14px; font-weight: 700; color: var(--opt-color); margin-bottom: 2px; }
.lang-option .opt-desc { font-size: 11px; color: var(--muted); font-family: 'IBM Plex Mono', monospace; }
.lang-option.ext-opt { opacity: 0.75; }
.modal-cancel {
  width: 100%;
  margin-top: 12px;
  padding: 10px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--muted);
  font-family: 'Cabinet Grotesk', sans-serif;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s;
}
.modal-cancel:hover { background: var(--surface2); color: var(--text); }

/* Input modal */
.input-modal-box {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 24px;
  width: 400px;
  max-width: 90vw;
  box-shadow: var(--shadow-lg);
}
.input-modal-title { font-size: 15px; font-weight: 800; margin-bottom: 10px; }
.input-modal-prompt {
  font-size: 12px;
  color: var(--muted);
  margin-bottom: 12px;
  font-family: 'IBM Plex Mono', monospace;
  background: var(--surface2);
  padding: 8px 12px;
  border-radius: 6px;
}
.input-field {
  width: 100%;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 14px;
  color: var(--text);
  font-family: 'IBM Plex Mono', monospace;
  font-size: 14px;
  outline: none;
  margin-bottom: 14px;
  transition: border-color 0.2s;
}
.input-field:focus { border-color: var(--text); }
.input-btns { display:flex; gap:8px; justify-content:flex-end; }
.btn-ok {
  padding: 8px 20px;
  background: var(--text);
  border: none;
  border-radius: 8px;
  color: var(--bg);
  font-family: 'Cabinet Grotesk', sans-serif;
  font-weight: 700;
  font-size: 13px;
  cursor: pointer;
}

/* Toast */
.toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%) translateY(80px);
  background: var(--text);
  color: var(--bg);
  padding: 10px 20px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 700;
  z-index: 999;
  transition: transform 0.3s ease;
  pointer-events: none;
  white-space: nowrap;
}
.toast.show { transform: translateX(-50%) translateY(0); }

/* Loading spinner inline */
.spin {
  display: inline-block;
  width: 12px; height: 12px;
  border: 2px solid rgba(255,255,255,0.3);
  border-top-color: white;
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
  vertical-align: middle;
}
@keyframes spin { to { transform: rotate(360deg); } }

@media (max-width: 600px) {
  .notebook { padding: 16px 12px 80px; }
  .lang-options { grid-template-columns: 1fr; }
  .header { padding: 0 12px; }
}
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div class="header-left">
    <div class="logo">Code<span>Lab</span> <span style="opacity:0.3">·</span> Notebook</div>
    <div class="header-status" id="globalStatus">Initializing...</div>
  </div>
  <div class="header-actions">
    <button class="hbtn hbtn-outline" onclick="runAll()">▶▶ Run All</button>
    <button class="hbtn hbtn-outline" onclick="clearAllOutputs()">Clear All</button>
    <button class="hbtn hbtn-outline" onclick="downloadNotebook()">⬇ Download</button>
    <button class="hbtn hbtn-solid" onclick="saveNotebook()">💾 Save</button>
  </div>
</div>

<!-- NOTEBOOK -->
<div class="notebook">
  <div class="notebook-title-area">
    <div class="notebook-title" contenteditable="true" id="notebookTitle">My Notebook</div>
    <div class="notebook-meta">
      <span id="cellCount">0 cells</span>
      <span id="lastSaved">Not saved yet</span>
    </div>
  </div>
  <div class="cells-container" id="cellsContainer"></div>
  <div class="add-cell-area">
    <button class="add-cell-btn" onclick="showLangPicker()">+ Add Cell</button>
  </div>
</div>

<!-- LANG PICKER MODAL -->
<div class="modal-overlay" id="langPickerModal" style="display:none">
  <div class="modal-box">
    <div class="modal-title">Choose Language</div>
    <div class="lang-options">
      <div class="lang-option" style="--opt-color:var(--py)" onclick="addCell('python')">
        <div class="opt-name">🐍 Python</div>
        <div class="opt-desc">Pyodide · numpy, pandas...</div>
      </div>
      <div class="lang-option" style="--opt-color:var(--js)" onclick="addCell('javascript')">
        <div class="opt-name">⚡ JavaScript</div>
        <div class="opt-desc">ES2024 · native browser</div>
      </div>
      <div class="lang-option" style="--opt-color:var(--sql)" onclick="addCell('sql')">
        <div class="opt-name">🗄️ SQL</div>
        <div class="opt-desc">SQLite · sql.js</div>
      </div>
      <div class="lang-option ext-opt" style="--opt-color:var(--cs)" onclick="addCell('csharp')">
        <div class="opt-name">💜 C#</div>
        <div class="opt-desc">External platform</div>
      </div>
      <div class="lang-option ext-opt" style="--opt-color:var(--rs)" onclick="addCell('rust')">
        <div class="opt-name">🦀 Rust</div>
        <div class="opt-desc">External platform</div>
      </div>
    </div>
    <button class="modal-cancel" onclick="hideLangPicker()">Cancel</button>
  </div>
</div>

<!-- INPUT MODAL -->
<div class="modal-overlay" id="inputModal" style="display:none">
  <div class="input-modal-box">
    <div class="input-modal-title">Input Required</div>
    <div class="input-modal-prompt" id="inputPrompt">Enter value:</div>
    <input class="input-field" id="inputField" type="text">
    <div class="input-btns">
      <button class="btn-ok" onclick="submitInput()">OK</button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.2/sql-wasm.js"></script>
<script>
// ========== CONFIG ==========
const LANG = {
  python:     { color: '#2563eb', label: 'Python',     icon: '🐍', external: false },
  javascript: { color: '#d97706', label: 'JavaScript', icon: '⚡', external: false },
  sql:        { color: '#059669', label: 'SQL',        icon: '🗄️', external: false },
  csharp:     { color: '#7c3aed', label: 'C#',         icon: '💜', external: true  },
  rust:       { color: '#dc2626', label: 'Rust',       icon: '🦀', external: true  },
};

const EXT_PLATFORMS = {
  csharp: [
    { name: '.NET Fiddle', url: 'https://dotnetfiddle.net/', icon: '🎻' },
    { name: 'OneCompiler', url: 'https://onecompiler.com/csharp', icon: '🖥️' },
    { name: 'Replit', url: 'https://replit.com/languages/csharp', icon: '♻️' },
  ],
  rust: [
    { name: 'Rust Playground', url: 'https://play.rust-lang.org/', icon: '🦀' },
    { name: 'OneCompiler', url: 'https://onecompiler.com/rust', icon: '🖥️' },
    { name: 'Replit', url: 'https://replit.com/languages/rust', icon: '♻️' },
  ]
};

const DEFAULT_CODE = {
  python: `import math, json

print("🐍 Hello Python!")
print(f"π = {math.pi:.6f}")

data = [x**2 for x in range(1, 6)]
print("Squares:", data)
`,
  javascript: `console.log("⚡ Hello JavaScript!");

const greet = name => \`Hello, \${name}!\`;
console.log(greet("World"));

const nums = [1,2,3,4,5].map(x => x * x);
console.log("Squares:", nums);
`,
  sql: `CREATE TABLE IF NOT EXISTS users (
  id INTEGER PRIMARY KEY,
  name TEXT,
  role TEXT,
  salary INTEGER
);

INSERT INTO users VALUES
  (1, 'Budi', 'Engineer', 9000000),
  (2, 'Sari', 'Designer', 8000000),
  (3, 'Andi', 'Engineer', 10000000);

SELECT role, COUNT(*) as total, AVG(salary) as avg_salary
FROM users GROUP BY role;
`,
};

// ========== STATE ==========
let cells = [];
let cellIdCounter = 0;
let pyodide = null;
let pyodideReady = false;
let pyodideLoading = false;
let sqlDB = null;
let sqlReady = false;
let inputResolve = null;

// ========== TOAST ==========
function toast(msg, duration = 2500) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), duration);
}

// ========== STATUS ==========
function setStatus(text, ready = false) {
  const el = document.getElementById('globalStatus');
  el.textContent = text;
  el.className = 'header-status' + (ready ? ' ready' : '');
}

// ========== LANG PICKER ==========
function showLangPicker() { document.getElementById('langPickerModal').style.display = 'flex'; }
function hideLangPicker() { document.getElementById('langPickerModal').style.display = 'none'; }

// ========== INPUT MODAL ==========
function askInput(prompt) {
  return new Promise(resolve => {
    inputResolve = resolve;
    document.getElementById('inputPrompt').textContent = prompt || 'Enter value:';
    document.getElementById('inputField').value = '';
    document.getElementById('inputModal').style.display = 'flex';
    setTimeout(() => document.getElementById('inputField').focus(), 50);
  });
}
function submitInput() {
  const val = document.getElementById('inputField').value;
  document.getElementById('inputModal').style.display = 'none';
  if (inputResolve) { inputResolve(val); inputResolve = null; }
}
document.getElementById('inputField').addEventListener('keydown', e => {
  if (e.key === 'Enter') submitInput();
});

// ========== CELL MANAGEMENT ==========
function addCell(lang) {
  hideLangPicker();
  const id = ++cellIdCounter;
  const cfg = LANG[lang];
  const cell = { id, lang, code: DEFAULT_CODE[lang] || '', output: null };
  cells.push(cell);
  renderCell(cell);
  updateMeta();
  autoSave();
  // Scroll to new cell
  setTimeout(() => {
    const el = document.getElementById(`cell-${id}`);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }, 100);
}

function deleteCell(id) {
  const idx = cells.findIndex(c => c.id === id);
  if (idx === -1) return;
  cells.splice(idx, 1);
  const el = document.getElementById(`cell-${id}`);
  if (el) {
    el.style.transition = 'opacity 0.2s, transform 0.2s';
    el.style.opacity = '0';
    el.style.transform = 'translateX(-10px)';
    setTimeout(() => { el.remove(); updateCellNumbers(); updateMeta(); }, 200);
  }
  autoSave();
}

function moveCell(id, dir) {
  const idx = cells.findIndex(c => c.id === id);
  const newIdx = idx + dir;
  if (newIdx < 0 || newIdx >= cells.length) return;
  [cells[idx], cells[newIdx]] = [cells[newIdx], cells[idx]];
  const container = document.getElementById('cellsContainer');
  const els = Array.from(container.children);
  const elA = document.getElementById(`cell-${cells[idx].id}`);
  const elB = document.getElementById(`cell-${cells[newIdx].id}`);
  if (dir === 1) container.insertBefore(elA, elB);
  else container.insertBefore(elB, elA);
  updateCellNumbers();
  autoSave();
}

function changeLang(id, lang) {
  const cell = cells.find(c => c.id === id);
  if (!cell) return;
  cell.lang = lang;
  // Re-render cell
  const el = document.getElementById(`cell-${id}`);
  if (!el) return;
  const cfg = LANG[lang];
  el.style.setProperty('--cell-color', cfg.color);

  // Update lang pills active state
  el.querySelectorAll('.lang-pill').forEach(p => {
    p.classList.toggle('active', p.dataset.lang === lang);
    if (p.dataset.lang === lang) p.style.setProperty('--lang-pill-color', cfg.color);
  });

  // Switch between editor and external
  const editorArea = el.querySelector('.cell-editor-area');
  const extArea = el.querySelector('.cell-external');
  const runBtn = el.querySelector('.run-btn');

  if (cfg.external) {
    if (editorArea) editorArea.style.display = 'none';
    if (extArea) {
      extArea.style.display = 'flex';
      extArea.innerHTML = renderExternalContent(lang);
    }
    if (runBtn) runBtn.style.display = 'none';
  } else {
    if (editorArea) editorArea.style.display = 'block';
    if (extArea) extArea.style.display = 'none';
    if (runBtn) {
      runBtn.style.display = 'flex';
      runBtn.style.background = cfg.color;
    }
    // Update textarea default if empty
    const ta = el.querySelector('textarea.cell-editor');
    if (ta && (!cell.code || cell.code === DEFAULT_CODE[cell.lang])) {
      ta.value = DEFAULT_CODE[lang] || '';
      cell.code = ta.value;
    }
  }

  autoSave();
}

function renderExternalContent(lang) {
  const platforms = EXT_PLATFORMS[lang] || [];
  return `
    <div class="ext-info">
      <div class="ext-info-title">${LANG[lang].icon} ${LANG[lang].label} memerlukan compiler eksternal</div>
      <div class="ext-info-desc">Buka salah satu platform di bawah untuk coding ${LANG[lang].label}:</div>
    </div>
    <div class="ext-links">
      ${platforms.map(p => `<a href="${p.url}" target="_blank" class="ext-link">${p.icon} ${p.name}</a>`).join('')}
    </div>
  `;
}

function renderCell(cell) {
  const cfg = LANG[cell.lang];
  const container = document.getElementById('cellsContainer');
  const idx = cells.findIndex(c => c.id === cell.id);

  const div = document.createElement('div');
  div.className = 'cell';
  div.id = `cell-${cell.id}`;
  div.style.setProperty('--cell-color', cfg.color);

  const langPills = Object.entries(LANG).map(([k, v]) => `
    <button class="lang-pill ${k === cell.lang ? 'active' : ''} ${v.external ? 'ext-pill' : ''}"
      data-lang="${k}"
      style="${k === cell.lang ? `--lang-pill-color:${v.color}` : ''}"
      onclick="changeLang(${cell.id}, '${k}')"
      title="${v.label}${v.external ? ' (External)' : ''}">
      ${v.label}
    </button>
  `).join('');

  const isExt = cfg.external;

  div.innerHTML = `
    <div class="cell-header">
      <div class="cell-left">
        <span class="cell-num" id="cellnum-${cell.id}">[${idx + 1}]</span>
        <div class="lang-selector">${langPills}</div>
      </div>
      <div class="cell-right">
        <button class="cell-btn" onclick="moveCell(${cell.id}, -1)" title="Move Up">↑</button>
        <button class="cell-btn" onclick="moveCell(${cell.id}, 1)" title="Move Down">↓</button>
        <button class="cell-btn" onclick="duplicateCell(${cell.id})" title="Duplicate">⧉</button>
        <button class="cell-btn danger" onclick="deleteCell(${cell.id})" title="Delete">✕</button>
        <button class="run-btn" id="runbtn-${cell.id}" onclick="runCell(${cell.id})"
          style="display:${isExt ? 'none' : 'flex'}; background:${cfg.color}">
          ▶ Run
        </button>
      </div>
    </div>
    <div class="cell-editor-area" style="display:${isExt ? 'none' : 'block'}">
      <textarea class="cell-editor" id="editor-${cell.id}" spellcheck="false"
        placeholder="Write ${cfg.label} code here..."
        onkeydown="handleEditorKey(event, ${cell.id})"
        oninput="onCodeInput(${cell.id})"
      >${escapeHtml(cell.code || '')}</textarea>
    </div>
    <div class="cell-external" style="display:${isExt ? 'flex' : 'none'}">
      ${isExt ? renderExternalContent(cell.lang) : ''}
    </div>
    <div class="cell-output" id="output-${cell.id}">
      <div class="out-header">
        <span class="out-label">Output</span>
        <span class="out-time" id="outtime-${cell.id}"></span>
      </div>
      <div id="outlines-${cell.id}"></div>
    </div>
  `;

  container.appendChild(div);

  // Focus handling for active state
  const ta = div.querySelector('textarea');
  if (ta) {
    ta.addEventListener('focus', () => div.classList.add('active'));
    ta.addEventListener('blur', () => div.classList.remove('active'));
  }
}

function escapeHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function handleEditorKey(e, id) {
  if (e.key === 'Tab') {
    e.preventDefault();
    const ta = e.target;
    const s = ta.selectionStart, end = ta.selectionEnd;
    ta.value = ta.value.substring(0, s) + '    ' + ta.value.substring(end);
    ta.selectionStart = ta.selectionEnd = s + 4;
  }
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
    e.preventDefault();
    runCell(id);
  }
}

function onCodeInput(id) {
  const cell = cells.find(c => c.id === id);
  if (cell) {
    const ta = document.getElementById(`editor-${id}`);
    if (ta) cell.code = ta.value;
    autoSave();
  }
}

function updateCellNumbers() {
  cells.forEach((cell, i) => {
    const el = document.getElementById(`cellnum-${cell.id}`);
    if (el) el.textContent = `[${i + 1}]`;
  });
}

function updateMeta() {
  document.getElementById('cellCount').textContent = `${cells.length} cell${cells.length !== 1 ? 's' : ''}`;
  updateCellNumbers();
}

function duplicateCell(id) {
  const cell = cells.find(c => c.id === id);
  if (!cell) return;
  const newId = ++cellIdCounter;
  const newCell = { id: newId, lang: cell.lang, code: cell.code, output: null };
  const idx = cells.findIndex(c => c.id === id);
  cells.splice(idx + 1, 0, newCell);

  // Insert after current cell in DOM
  renderCellAfter(newCell, id);
  updateCellNumbers();
  updateMeta();
  autoSave();
}

function renderCellAfter(cell, afterId) {
  const afterEl = document.getElementById(`cell-${afterId}`);
  const tempDiv = document.createElement('div');
  const container = document.getElementById('cellsContainer');

  // Temporarily append to get the element, then insert
  const cfg = LANG[cell.lang];
  const div = document.createElement('div');
  div.className = 'cell';
  div.id = `cell-${cell.id}`;
  div.style.setProperty('--cell-color', cfg.color);
  div.style.opacity = '0';
  div.style.transform = 'translateY(-8px)';
  div.style.transition = 'opacity 0.2s, transform 0.2s';

  const langPills = Object.entries(LANG).map(([k, v]) => `
    <button class="lang-pill ${k === cell.lang ? 'active' : ''} ${v.external ? 'ext-pill' : ''}"
      data-lang="${k}"
      style="${k === cell.lang ? `--lang-pill-color:${v.color}` : ''}"
      onclick="changeLang(${cell.id}, '${k}')">${v.label}</button>
  `).join('');

  const isExt = cfg.external;
  div.innerHTML = `
    <div class="cell-header">
      <div class="cell-left">
        <span class="cell-num" id="cellnum-${cell.id}">[?]</span>
        <div class="lang-selector">${langPills}</div>
      </div>
      <div class="cell-right">
        <button class="cell-btn" onclick="moveCell(${cell.id}, -1)">↑</button>
        <button class="cell-btn" onclick="moveCell(${cell.id}, 1)">↓</button>
        <button class="cell-btn" onclick="duplicateCell(${cell.id})">⧉</button>
        <button class="cell-btn danger" onclick="deleteCell(${cell.id})">✕</button>
        <button class="run-btn" id="runbtn-${cell.id}" onclick="runCell(${cell.id})"
          style="display:${isExt ? 'none' : 'flex'}; background:${cfg.color}">▶ Run</button>
      </div>
    </div>
    <div class="cell-editor-area" style="display:${isExt ? 'none' : 'block'}">
      <textarea class="cell-editor" id="editor-${cell.id}" spellcheck="false"
        onkeydown="handleEditorKey(event, ${cell.id})"
        oninput="onCodeInput(${cell.id})"
      >${escapeHtml(cell.code || '')}</textarea>
    </div>
    <div class="cell-external" style="display:${isExt ? 'flex' : 'none'}">
      ${isExt ? renderExternalContent(cell.lang) : ''}
    </div>
    <div class="cell-output" id="output-${cell.id}">
      <div class="out-header">
        <span class="out-label">Output</span>
        <span class="out-time" id="outtime-${cell.id}"></span>
      </div>
      <div id="outlines-${cell.id}"></div>
    </div>
  `;

  if (afterEl && afterEl.nextSibling) {
    container.insertBefore(div, afterEl.nextSibling);
  } else {
    container.appendChild(div);
  }

  const ta = div.querySelector('textarea');
  if (ta) {
    ta.addEventListener('focus', () => div.classList.add('active'));
    ta.addEventListener('blur', () => div.classList.remove('active'));
  }

  requestAnimationFrame(() => {
    div.style.opacity = '1';
    div.style.transform = 'translateY(0)';
  });
}

// ========== OUTPUT ==========
function printLine(cellId, text, type = '') {
  const outEl = document.getElementById(`output-${cellId}`);
  const linesEl = document.getElementById(`outlines-${cellId}`);
  if (!outEl || !linesEl) return;
  outEl.classList.add('visible');
  const div = document.createElement('div');
  div.className = 'out-line' + (type ? ' ' + type : '');
  div.textContent = text;
  linesEl.appendChild(div);
  outEl.scrollTop = outEl.scrollHeight;
}

function clearCellOutput(cellId) {
  const outEl = document.getElementById(`output-${cellId}`);
  const linesEl = document.getElementById(`outlines-${cellId}`);
  if (outEl) outEl.classList.remove('visible');
  if (linesEl) linesEl.innerHTML = '';
  const timeEl = document.getElementById(`outtime-${cellId}`);
  if (timeEl) timeEl.textContent = '';
}

// ========== RUN ==========
async function runCell(id) {
  const cell = cells.find(c => c.id === id);
  if (!cell) return;
  const ta = document.getElementById(`editor-${id}`);
  const code = ta ? ta.value.trim() : cell.code.trim();
  if (!code) return;

  const btn = document.getElementById(`runbtn-${id}`);
  if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spin"></span> Running'; }

  clearCellOutput(id);
  const t0 = performance.now();

  try {
    if (cell.lang === 'python') await runPython(id, code);
    else if (cell.lang === 'javascript') await runJS(id, code);
    else if (cell.lang === 'sql') await runSQL(id, code);
  } catch(e) {
    printLine(id, '❌ ' + e.message, 'err');
  }

  const elapsed = ((performance.now() - t0) / 1000).toFixed(3);
  const timeEl = document.getElementById(`outtime-${id}`);
  if (timeEl) timeEl.textContent = `⏱ ${elapsed}s`;

  if (btn) {
    const cfg = LANG[cell.lang];
    btn.disabled = false;
    btn.innerHTML = '▶ Run';
    btn.style.background = cfg.color;
  }
}

async function runAll() {
  for (const cell of cells) {
    if (!LANG[cell.lang].external) await runCell(cell.id);
  }
  toast('✅ All cells executed!');
}

function clearAllOutputs() {
  cells.forEach(c => clearCellOutput(c.id));
  toast('🧹 Outputs cleared');
}

// ========== PYTHON ==========
async function ensurePyodide(cellId) {
  if (pyodideReady) return true;
  if (pyodideLoading) {
    // Wait
    printLine(cellId, '⏳ Waiting for Python runtime...', 'info');
    await new Promise(r => { const iv = setInterval(() => { if (pyodideReady || !pyodideLoading) { clearInterval(iv); r(); } }, 300); });
    return pyodideReady;
  }
  pyodideLoading = true;
  setStatus('Loading Python...');
  printLine(cellId, '⏳ Loading Python (Pyodide)... This may take 10–30 seconds.', 'info');

  try {
    await new Promise((res, rej) => {
      const s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/pyodide/v0.26.2/full/pyodide.js';
      s.onload = res; s.onerror = () => rej(new Error('Failed to load Pyodide'));
      document.head.appendChild(s);
    });
    pyodide = await window.loadPyodide({ indexURL: 'https://cdn.jsdelivr.net/pyodide/v0.26.2/full/' });
    pyodideReady = true;
    pyodideLoading = false;
    setStatus('Ready', true);
    printLine(cellId, '✅ Python ready! numpy, pandas, scipy, scikit-learn available.', 'ok');
    return true;
  } catch(e) {
    pyodideLoading = false;
    setStatus('Python failed');
    printLine(cellId, '❌ Failed to load Python: ' + e.message, 'err');
    return false;
  }
}

async function runPython(cellId, code) {
  const ok = await ensurePyodide(cellId);
  if (!ok) return;

  try {
    pyodide.runPython(`
import sys, io
_buf = io.StringIO()
sys.stdout = _buf
sys.stderr = _buf
`);
    await pyodide.runPythonAsync(code);
    const out = pyodide.runPython(`
_v = _buf.getvalue()
sys.stdout = sys.__stdout__
sys.stderr = sys.__stderr__
_v
`);
    if (out) out.split('\n').forEach(l => { if (l !== '') printLine(cellId, l); });
    else printLine(cellId, '(no output)', 'info');
  } catch(e) {
    e.message.split('\n').forEach(l => printLine(cellId, l, 'err'));
  }
}

// ========== JAVASCRIPT ==========
async function runJS(cellId, code) {
  const origLog = console.log, origErr = console.error, origWarn = console.warn;

  const cap = (type) => (...args) => {
    const text = args.map(a => typeof a === 'object' ? JSON.stringify(a, null, 2) : String(a)).join(' ');
    printLine(cellId, text, type === 'error' ? 'err' : type === 'warn' ? 'warn' : '');
  };
  console.log = cap('log'); console.error = cap('error'); console.warn = cap('warn');

  try {
    await eval(`(async () => { ${code} })()`);
  } catch(e) {
    printLine(cellId, '❌ ' + e.name + ': ' + e.message, 'err');
  } finally {
    console.log = origLog; console.error = origErr; console.warn = origWarn;
  }
}

// ========== SQL ==========
async function ensureSQL(cellId) {
  if (sqlReady) return true;
  printLine(cellId, '⏳ Loading SQLite...', 'info');
  try {
    const SQL = await initSqlJs({ locateFile: f => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.2/${f}` });
    sqlDB = new SQL.Database();
    sqlReady = true;
    printLine(cellId, '✅ SQLite ready!', 'ok');
    return true;
  } catch(e) {
    printLine(cellId, '❌ SQLite failed: ' + e.message, 'err');
    return false;
  }
}

async function runSQL(cellId, code) {
  const ok = await ensureSQL(cellId);
  if (!ok) return;

  const stmts = code.split(';').map(s => s.trim()).filter(s => s);
  for (const stmt of stmts) {
    try {
      const results = sqlDB.exec(stmt + ';');
      if (results.length > 0) {
        results.forEach(res => {
          // Header
          const colWidths = res.columns.map((c, i) => Math.max(c.length, ...res.values.map(r => String(r[i] ?? '').length)));
          const sep = '+' + colWidths.map(w => '-'.repeat(w + 2)).join('+') + '+';
          const headerRow = '| ' + res.columns.map((c, i) => c.padEnd(colWidths[i])).join(' | ') + ' |';
          printLine(cellId, sep, 'ok');
          printLine(cellId, headerRow, 'ok');
          printLine(cellId, sep, 'ok');
          res.values.forEach(row => {
            const rowStr = '| ' + row.map((v, i) => String(v ?? '').padEnd(colWidths[i])).join(' | ') + ' |';
            printLine(cellId, rowStr);
          });
          printLine(cellId, sep, 'ok');
          printLine(cellId, `  ${res.values.length} row(s)`, 'info');
        });
      } else {
        const lo = stmt.toLowerCase().trim();
        const msg = lo.startsWith('create') ? '✅ Table created' :
                    lo.startsWith('insert') ? '✅ Inserted' :
                    lo.startsWith('update') ? '✅ Updated' :
                    lo.startsWith('delete') ? '✅ Deleted' :
                    lo.startsWith('drop')   ? '✅ Dropped' : '✅ OK';
        printLine(cellId, msg, 'ok');
      }
    } catch(e) {
      printLine(cellId, '❌ ' + e.message, 'err');
    }
  }
}

// ========== SAVE / LOAD ==========
function getNotebookData() {
  // Sync code from textareas
  cells.forEach(cell => {
    const ta = document.getElementById(`editor-${cell.id}`);
    if (ta) cell.code = ta.value;
  });
  return {
    title: document.getElementById('notebookTitle').textContent,
    cells: cells.map(c => ({ lang: c.lang, code: c.code })),
    savedAt: new Date().toISOString()
  };
}

function saveNotebook() {
  try {
    const data = getNotebookData();
    localStorage.setItem('codelab_notebook', JSON.stringify(data));
    const timeStr = new Date().toLocaleTimeString();
    document.getElementById('lastSaved').textContent = `Saved at ${timeStr}`;
    toast('💾 Saved to browser!');
  } catch(e) {
    toast('❌ Save failed: ' + e.message);
  }
}

function autoSave() {
  try {
    const data = getNotebookData();
    localStorage.setItem('codelab_notebook_auto', JSON.stringify(data));
  } catch(e) {}
}

function downloadNotebook() {
  const data = getNotebookData();
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = (data.title || 'notebook').replace(/\s+/g, '_') + '.codelab.json';
  a.click();
  URL.revokeObjectURL(url);
  toast('⬇ Downloaded!');
}

function loadNotebook(data) {
  if (!data) return;
  try {
    document.getElementById('notebookTitle').textContent = data.title || 'My Notebook';
    cells = [];
    cellIdCounter = 0;
    document.getElementById('cellsContainer').innerHTML = '';

    (data.cells || []).forEach(c => {
      const id = ++cellIdCounter;
      const cell = { id, lang: c.lang || 'python', code: c.code || '', output: null };
      cells.push(cell);
      renderCell(cell);
      // Set actual code in textarea
      setTimeout(() => {
        const ta = document.getElementById(`editor-${id}`);
        if (ta) ta.value = cell.code;
      }, 0);
    });

    updateMeta();
    if (data.savedAt) {
      document.getElementById('lastSaved').textContent = 'Loaded from ' + new Date(data.savedAt).toLocaleString();
    }
  } catch(e) {
    console.error('Load error:', e);
  }
}

// ========== INIT ==========
function init() {
  setStatus('Initializing...');

  // Try load from localStorage
  let loaded = false;
  try {
    const saved = localStorage.getItem('codelab_notebook') || localStorage.getItem('codelab_notebook_auto');
    if (saved) {
      const data = JSON.parse(saved);
      if (data.cells && data.cells.length > 0) {
        loadNotebook(data);
        loaded = true;
        toast('📂 Notebook restored!');
      }
    }
  } catch(e) {}

  if (!loaded) {
    // Default: add one Python cell
    addCell('python');
  }

  setStatus('Ready', true);

  // Preload SQL in background
  initSqlJs({ locateFile: f => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.2/${f}` })
    .then(SQL => { sqlDB = new SQL.Database(); sqlReady = true; })
    .catch(() => {});

  // Auto-save every 30s
  setInterval(autoSave, 30000);

  // Ctrl+S to save
  document.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key === 's') {
      e.preventDefault();
      saveNotebook();
    }
  });
}

init();
